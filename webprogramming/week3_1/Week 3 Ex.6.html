<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navigation Bar</title>

  <style>
    nav {
      background-color: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
    }

    .logo {
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .links {
      display: flex;
      gap: 20px;
    }

    .links a {
      color: white;
      text-decoration: none;
    }

    .links a:hover {
      color: #10B981;
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">My Website</div>

    <div class="links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Projects</a>
      <a href="#">Contact</a>
    </div>
  </nav>

</body>
</html>
