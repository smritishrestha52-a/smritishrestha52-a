<!DOCTYPE html>
<html>
<head>
    <title>My Colour Boxes</title>

    <style>
        .colors {
            display: flex;
            gap: 15px;
        }

        .box {
            padding: 25px 18px;
            color: white;
            font-weight: bold;
            border-radius: 6px;
        }

        .pink {
            background-color: #db2777;
        }

        .teal {
            background-color: #0d9488;
        }

        .yellow {
            background-color: #ca8a04;
        }

        .indigo {
            background-color: #4f46e5;
        }

        .brown {
            background-color: #92400e;
        }
    </style>
</head>

<body>

    <div class="colors">
        <div class="box pink">Pink</div>
        <div class="box teal">Teal</div>
        <div class="box yellow">Yellow</div>
        <div class="box indigo">Indigo</div>
        <div class="box brown">Brown</div>
    </div>

</body>
</html>
