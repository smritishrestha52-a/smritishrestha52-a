<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eff6ff;
    }

    h1 {
      color: #1d4ed8;
      font-size: 2.2rem;
      text-align: center;
    }

    p {
      line-height: 1.6;
      color: #475569;
    }

    /* This is a CSS comment */
    .highlight {
      background-color: #dbeafe;
    }
  </style>
</head>

<body>
  <h1>Learning CSS</h1>

  <p>This paragraph contains <span class="highlight">important text</span> with a different background.</p>
</body>
</html>
